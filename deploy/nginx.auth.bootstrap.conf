# Install as /etc/nginx/sites-available/auth.theblackhaired.ru before requesting
# the first certificate with certbot certonly --webroot.
server {
    listen 80;
    listen [::]:80;
    server_name auth.theblackhaired.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 404;
    }
}
