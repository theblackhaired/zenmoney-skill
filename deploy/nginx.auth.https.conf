# Install after certbot has issued the auth.theblackhaired.ru certificate.
# Keycloak listens on loopback only; this vhost is its public entry point.
server {
    listen 80;
    listen [::]:80;
    server_name auth.theblackhaired.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name auth.theblackhaired.ru;

    ssl_certificate /etc/letsencrypt/live/auth.theblackhaired.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auth.theblackhaired.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Replace client supplied forwarding headers with values from this proxy.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Forwarded-For $remote_addr;

    location = /auth {
        return 301 /auth/;
    }

    location ^~ /auth/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
    }

    location / {
        return 404;
    }
}
