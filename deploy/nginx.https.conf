# Install after certbot has issued the certificate. Nginx is the sole public
# entry point; both application processes listen on loopback only.
server {
    listen 80;
    listen [::]:80;
    server_name budget.theblackhaired.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name budget.theblackhaired.ru;

    ssl_certificate /etc/letsencrypt/live/budget.theblackhaired.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/budget.theblackhaired.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Replace client supplied forwarding headers with values from this proxy.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Forwarded-For $remote_addr;

    location = /mcp {
        proxy_pass http://127.0.0.1:8769;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location ^~ /.well-known/oauth-protected-resource {
        proxy_pass http://127.0.0.1:8769;
        proxy_http_version 1.1;
    }

    location = /auth {
        return 301 /auth/;
    }

    location ^~ /auth/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
    }

    location / {
        return 404;
    }
}
